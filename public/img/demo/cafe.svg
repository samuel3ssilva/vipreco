<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" role="img" aria-hidden="true" focusable="false">
  <!--
    ViPreço — ilustração GENÉRICA de categoria, feita para a demonstração do piloto.
    Não representa nenhuma embalagem, marca, logotipo ou identidade visual de terceiro.
    Ver docs/data/IMAGE-POLICY.md e docs/evidence/visual/r33/README.md.

    R3.3C: o desenho foi refeito para ser reconhecível A 64 px, que é o tamanho em que ele
    aparece na lista de Achados. O que mudou: a solda superior passou a ser mais LARGA que o
    corpo, com os vincos à mostra — sem isso ela lia como tampa de pote, e o pacote inteiro
    virava um vidro de café solúvel. O corpo ganhou o afunilamento do pacote de pé, e os grãos
    soltos ficam fora do contorno: são a única coisa do desenho que nomeia a categoria sem
    depender de embalagem nenhuma.
  -->
  <rect width="160" height="160" fill="#F1EFE4" />
  <ellipse cx="80" cy="141" rx="45" ry="6.5" fill="#10231C" opacity="0.09" />

  <!-- grãos soltos, fora do pacote: quebram o retângulo e dizem a categoria de longe -->
  <g transform="rotate(-28 31 132)">
    <ellipse cx="31" cy="132" rx="9" ry="6.2" fill="#0A3F29" />
    <path d="M31 126.2c-2.5 2.8-2.5 8.8 0 11.6" fill="none" stroke="#F1EFE4" stroke-width="1.9" stroke-linecap="round" />
  </g>
  <g transform="rotate(18 129 135)">
    <ellipse cx="129" cy="135" rx="9" ry="6.2" fill="#0A3F29" />
    <path d="M129 129.2c-2.5 2.8-2.5 8.8 0 11.6" fill="none" stroke="#F1EFE4" stroke-width="1.9" stroke-linecap="round" />
  </g>

  <defs>
    <clipPath id="vp-cafe-corpo">
      <path d="M47 31h66l4 84a12 12 0 0 1-12 12H55a12 12 0 0 1-12-12z" />
    </clipPath>
  </defs>

  <!-- corpo do pacote de pé, levemente afunilado -->
  <path d="M47 31h66l4 84a12 12 0 0 1-12 12H55a12 12 0 0 1-12-12z" fill="#0E5C3C" />
  <g clip-path="url(#vp-cafe-corpo)">
    <rect x="43" y="31" width="16" height="96" fill="#FFFFFF" opacity="0.1" />
    <rect x="103" y="31" width="14" height="96" fill="#10231C" opacity="0.14" />
    <!-- faixa clara, cortada pelo contorno do pacote -->
    <rect x="40" y="58" width="80" height="44" fill="#FBF7EC" />
    <rect x="40" y="110" width="80" height="6" fill="#F5C24B" />
  </g>

  <!-- solda superior: mais larga que o corpo, com os vincos -->
  <rect x="39" y="20" width="82" height="11" rx="3" fill="#0A3F29" />
  <g fill="#0E5C3C" opacity="0.55">
    <rect x="49" y="22" width="2.5" height="7" rx="1.2" />
    <rect x="63" y="22" width="2.5" height="7" rx="1.2" />
    <rect x="77" y="22" width="2.5" height="7" rx="1.2" />
    <rect x="91" y="22" width="2.5" height="7" rx="1.2" />
    <rect x="105" y="22" width="2.5" height="7" rx="1.2" />
  </g>

  <!-- os grãos da faixa -->
  <g transform="rotate(-20 62 80)">
    <ellipse cx="62" cy="80" rx="9.5" ry="6.6" fill="#0E5C3C" />
    <path d="M62 73.8c-2.7 3-2.7 9.4 0 12.4" fill="none" stroke="#FBF7EC" stroke-width="2" stroke-linecap="round" />
  </g>
  <g transform="rotate(12 80 80)">
    <ellipse cx="80" cy="80" rx="9.5" ry="6.6" fill="#0E5C3C" />
    <path d="M80 73.8c-2.7 3-2.7 9.4 0 12.4" fill="none" stroke="#FBF7EC" stroke-width="2" stroke-linecap="round" />
  </g>
  <g transform="rotate(-20 98 80)">
    <ellipse cx="98" cy="80" rx="9.5" ry="6.6" fill="#0E5C3C" />
    <path d="M98 73.8c-2.7 3-2.7 9.4 0 12.4" fill="none" stroke="#FBF7EC" stroke-width="2" stroke-linecap="round" />
  </g>
</svg>
