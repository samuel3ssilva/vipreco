name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: lint, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # HISTÓRICO COMPLETO, E NÃO POR CAPRICHO.
          #
          # O padrão do `actions/checkout` é um clone raso (`fetch-depth: 1`), e num clone
          # raso `origin/main` NÃO EXISTE no runner. Os contratos de laboratório provam
          # "a Home, a busca, a comparação e o ranking continuam intactos" comparando a
          # árvore com `origin/main` — sem ela, essa prova não acontecia, e o check ficava
          # verde sem ter medido nada. Ou seja: o único lugar em que alguém lê o verde como
          # garantia era exatamente o lugar em que a garantia não era produzida.
          #
          # Com `0`, o checkout traz todas as refs, `origin/main` passa a existir e a
          # comparação é real. A outra metade da correção está em `src/test-support/
          # git-guard.ts`, que LANÇA quando não consegue comparar: se esta linha for
          # removida um dia, o CI fica vermelho com o motivo escrito, em vez de silencioso.
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      - name: Verify no uncommitted or generated-file drift
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Working tree changed after install/lint/test/build. Generated files (e.g. src/routeTree.gen.ts) or the lockfile are out of sync with the committed state."
            git status --porcelain
            git diff
            exit 1
          fi
