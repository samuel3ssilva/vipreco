<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="ViPreço para mercados de Artemis, piloto em preparação">
  <title>ViPreço para mercados de Artemis</title>

  <!-- Visto v2. Tudo o que importa vive na área central de 630x500
       (x 285..915, y 65..565); as faixas laterais são ornamento. -->
  <rect width="1200" height="630" fill="#FBF7EC"/>
  <rect width="190" height="630" fill="#0E5C3C"/>
  <rect x="1010" width="190" height="630" fill="#0E5C3C"/>

  <g fill="none" stroke="#2F7A56" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="9,26 20,38 39,17" transform="translate(-40 60) scale(4.2)"/>
    <polyline points="9,26 20,38 39,17" transform="translate(1050 380) scale(4.2)"/>
  </g>

  <!-- Marca -->
  <g transform="translate(452 126) scale(1.1)">
    <polyline points="9,26 20,38 39,17" fill="none" stroke="#0E5C3C" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="39" cy="6.5" r="4.6" fill="#F5C24B"/>
  </g>
  <text x="518" y="168" font-family="Bricolage Grotesque" font-weight="800" font-size="44" letter-spacing="-1.5" fill="#10231C">Vi<tspan fill="#0E5C3C">Preço</tspan></text>

  <!-- Promessa -->
  <text x="600" y="318" text-anchor="middle" font-family="Bricolage Grotesque" font-weight="800" font-size="66" letter-spacing="-2" fill="#10231C">Para mercados</text>
  <text x="600" y="398" text-anchor="middle" font-family="Bricolage Grotesque" font-weight="800" font-size="66" letter-spacing="-2" fill="#10231C">de Artemis</text>

  <!-- Estado real do piloto -->
  <rect x="421" y="462" width="358" height="58" rx="29" fill="#E7F1EA" stroke="#0E5C3C" stroke-width="2"/>
  <text x="600" y="500" text-anchor="middle" font-family="Public Sans" font-weight="600" font-size="28" fill="#0E5C3C">Piloto em preparação</text>
</svg>
