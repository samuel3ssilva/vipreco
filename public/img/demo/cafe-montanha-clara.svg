<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 360" width="300" height="360" role="img" aria-hidden="true" focusable="false">
  <!--
    ViPreço — embalagem FICTÍCIA "Montanha Clara", desenhada para a demonstração.
    Marca inventada, sem logotipo, sem trade dress de terceiro. Ver docs/data/IMAGE-POLICY.md.

    SILHUETA DIFERENTE DE PROPÓSITO. Ela divide a prateleira da busca com "Serra Alta" e
    "Vale Verde", e três pacotes iguais em cores diferentes leriam como o mesmo produto
    recolorido. Este é um stand-up pouch: base larga com fole, ombros arredondados, zíper
    abaixo da solda — a forma que o olho separa do tijolinho a vácuo antes de ler o rótulo.
  -->
  <defs>
    <linearGradient id="mc-corpo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7a5418" />
      <stop offset="0.13" stop-color="#c08b2c" />
      <stop offset="0.36" stop-color="#e0ab45" />
      <stop offset="0.58" stop-color="#cf9834" />
      <stop offset="0.84" stop-color="#8d6320" />
      <stop offset="1" stop-color="#5c3e11" />
    </linearGradient>
    <linearGradient id="mc-brilho" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.4" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <clipPath id="mc-clip">
      <path d="M74 76h152c8 0 12 6 12 14l6 128c2 30 8 40 8 52H50c0-12 6-22 8-52l6-128c0-8 4-14 10-14z" />
    </clipPath>
  </defs>

  <ellipse cx="150" cy="278" rx="94" ry="13" fill="#10231c" opacity="0.16" />

  <!-- corpo do pouch -->
  <path d="M74 76h152c8 0 12 6 12 14l6 128c2 30 8 40 8 52H50c0-12 6-22 8-52l6-128c0-8 4-14 10-14z" fill="url(#mc-corpo)" />
  <g clip-path="url(#mc-clip)">
    <rect x="94" y="70" width="26" height="210" fill="url(#mc-brilho)" />
    <rect x="216" y="70" width="24" height="210" fill="#3c2709" opacity="0.28" />
    <!-- fole da base: dois vincos que dizem que o pacote fica em pé -->
    <path d="M50 250h200v6H50z" fill="#3c2709" opacity="0.22" />
    <path d="M96 250v22M204 250v22" stroke="#3c2709" stroke-opacity="0.3" stroke-width="3" />

    <!-- zíper -->
    <rect x="60" y="90" width="180" height="7" rx="3" fill="#fbf7ec" opacity="0.55" />

    <!-- rótulo oval, típico de pouch de café especial -->
    <ellipse cx="150" cy="172" rx="76" ry="56" fill="#fbf7ec" />
    <ellipse cx="150" cy="172" rx="76" ry="56" fill="none" stroke="#7a5418" stroke-width="2.5" />

    <!-- montanha clara: o nome é o desenho -->
    <path d="M104 168l20-26 13 17 16-22 15 19 14-13 14 25z" fill="#a9c9bb" />
    <path d="M124 142l7 9-7 9-7-9z" fill="#fbf7ec" />

    <text x="150" y="142" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="0.3" fill="#5c3e11">MONTANHA CLARA</text>
    <text x="150" y="192" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="2.6" fill="#8a6412">TRADICIONAL</text>
    <text x="150" y="208" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="8" letter-spacing="0.6" fill="#5b6b63">CAFÉ TORRADO E MOÍDO</text>

    <rect x="112" y="234" width="76" height="24" rx="12" fill="#fbf7ec" opacity="0.94" />
    <text x="150" y="251" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#5c3e11">500 g</text>
  </g>

  <!-- solda superior -->
  <rect x="66" y="58" width="168" height="20" rx="4" fill="#5c3e11" />
  <g fill="#ffffff" opacity="0.14">
    <rect x="82" y="62" width="3" height="12" rx="1.5" />
    <rect x="104" y="62" width="3" height="12" rx="1.5" />
    <rect x="126" y="62" width="3" height="12" rx="1.5" />
    <rect x="148" y="62" width="3" height="12" rx="1.5" />
    <rect x="170" y="62" width="3" height="12" rx="1.5" />
    <rect x="192" y="62" width="3" height="12" rx="1.5" />
    <rect x="214" y="62" width="3" height="12" rx="1.5" />
  </g>
  <rect x="66" y="58" width="168" height="3" rx="1.5" fill="#ffffff" opacity="0.2" />

  <!-- grãos soltos -->
  <g transform="rotate(-22 44 276)">
    <ellipse cx="44" cy="276" rx="12" ry="8.4" fill="#5c3e11" />
    <path d="M44 268.2c-3.2 3.7-3.2 11.9 0 15.6" fill="none" stroke="#e0ab45" stroke-width="2.1" stroke-linecap="round" />
  </g>
  <g transform="rotate(16 260 282)">
    <ellipse cx="260" cy="282" rx="11" ry="7.7" fill="#7a5418" />
    <path d="M260 274.8c-2.9 3.4-2.9 10.9 0 14.3" fill="none" stroke="#e0ab45" stroke-width="2" stroke-linecap="round" />
  </g>
</svg>
