<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" role="img" aria-hidden="true" focusable="false">
  <!--
    ViPreço — ilustração GENÉRICA de categoria, feita para a demonstração do piloto.
    Não representa nenhuma embalagem, marca, logotipo ou identidade visual de terceiro.
    Ver docs/data/IMAGE-POLICY.md e docs/evidence/visual/r33/README.md.

    R3.3C: era o mais fraco dos três — a 64 px lia como um pote com uma faixa escura. Agora é
    o formato que o pacote de arroz tem de verdade: fardo de plástico com solda em cima e
    embaixo, e uma JANELA TRANSPARENTE com os grãos à vista. A janela é o que nomeia a
    categoria; sem ela o desenho seria um retângulo claro qualquer. As soldas são desenhadas
    DEPOIS do corpo, senão elas somem atrás dele — foi o que aconteceu na primeira versão.
  -->
  <rect width="160" height="160" fill="#F1EFE4" />
  <ellipse cx="80" cy="140" rx="44" ry="6.5" fill="#10231C" opacity="0.09" />

  <!-- corpo do fardo -->
  <rect x="42" y="28" width="76" height="100" rx="9" fill="#FBF7EC" stroke="#C9C4B2" stroke-width="2" />
  <path d="M42 37a9 9 0 0 1 9-9h58a9 9 0 0 1 9 9v15H42z" fill="#0E5C3C" />
  <rect x="42" y="52" width="76" height="3.5" fill="#F5C24B" />
  <!-- brilho do plástico -->
  <rect x="49" y="34" width="9" height="88" rx="4.5" fill="#FFFFFF" opacity="0.6" />

  <!-- janela transparente com os grãos -->
  <rect x="52" y="63" width="56" height="52" rx="9" fill="#EADFBE" stroke="#C9C4B2" stroke-width="1.5" />
  <g fill="#FFFDF6">
    <ellipse cx="65" cy="75" rx="6.5" ry="3" transform="rotate(-18 65 75)" />
    <ellipse cx="80" cy="73" rx="6.5" ry="3" transform="rotate(9 80 73)" />
    <ellipse cx="95" cy="76" rx="6.5" ry="3" transform="rotate(-8 95 76)" />
    <ellipse cx="62" cy="88" rx="6.5" ry="3" transform="rotate(13 62 88)" />
    <ellipse cx="78" cy="89" rx="6.5" ry="3" transform="rotate(-22 78 89)" />
    <ellipse cx="94" cy="87" rx="6.5" ry="3" transform="rotate(17 94 87)" />
    <ellipse cx="66" cy="101" rx="6.5" ry="3" transform="rotate(-6 66 101)" />
    <ellipse cx="83" cy="103" rx="6.5" ry="3" transform="rotate(21 83 103)" />
    <ellipse cx="97" cy="100" rx="6.5" ry="3" transform="rotate(-14 97 100)" />
  </g>

  <!-- soldas, por cima do corpo -->
  <rect x="50" y="20" width="60" height="13" rx="4" fill="#2F7A56" />
  <rect x="55" y="23" width="50" height="2.5" rx="1.2" fill="#FBF7EC" opacity="0.35" />
  <rect x="50" y="121" width="60" height="13" rx="4" fill="#2F7A56" />
  <rect x="55" y="124" width="50" height="2.5" rx="1.2" fill="#FBF7EC" opacity="0.35" />
</svg>
