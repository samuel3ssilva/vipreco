<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 360" width="300" height="360" role="img" aria-hidden="true" focusable="false">
  <!--
    ViPreço — embalagem FICTÍCIA "Brilho Claro", desenhada para a demonstração.
    Marca inventada, sem logotipo, sem trade dress de terceiro. Ver docs/data/IMAGE-POLICY.md.

    Frasco squeeze de 500 ml: cintura estreita para a mão, tampa flip-top alta e o líquido
    translúcido atrás do rótulo. As bolhas ao lado dizem a categoria antes do texto.
  -->
  <defs>
    <linearGradient id="det-corpo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8fb9cc" />
      <stop offset="0.14" stop-color="#d8ecf3" />
      <stop offset="0.36" stop-color="#f2fbfd" />
      <stop offset="0.66" stop-color="#cfe6ef" />
      <stop offset="1" stop-color="#7ba7bb" />
    </linearGradient>
    <linearGradient id="det-rotulo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d6d0be" />
      <stop offset="0.14" stop-color="#fbf7ec" />
      <stop offset="0.62" stop-color="#ffffff" />
      <stop offset="1" stop-color="#cfc8b5" />
    </linearGradient>
    <clipPath id="det-clip">
      <path d="M118 84h64c6 0 10 4 11 10l5 34c1 8-4 12-4 20v122c0 14-9 22-23 22h-42c-14 0-23-8-23-22V148c0-8-5-12-4-20l5-34c1-6 5-10 11-10z" />
    </clipPath>
  </defs>

  <ellipse cx="150" cy="294" rx="60" ry="10" fill="#10231c" opacity="0.16" />

  <!-- tampa flip-top -->
  <path d="M134 30h32a5 5 0 0 1 5 5v30h-42V35a5 5 0 0 1 5-5z" fill="#12694a" />
  <path d="M134 30h10v35h-10z" fill="#ffffff" opacity="0.2" />
  <rect x="127" y="63" width="46" height="10" rx="3" fill="#0a3f29" />
  <rect x="140" y="26" width="20" height="6" rx="3" fill="#0a3f29" opacity="0.6" />
  <!-- gargalo -->
  <rect x="132" y="72" width="36" height="14" fill="#bcd9e4" />

  <!-- corpo -->
  <path d="M118 84h64c6 0 10 4 11 10l5 34c1 8-4 12-4 20v122c0 14-9 22-23 22h-42c-14 0-23-8-23-22V148c0-8-5-12-4-20l5-34c1-6 5-10 11-10z" fill="url(#det-corpo)" />
  <g clip-path="url(#det-clip)">
    <rect x="124" y="80" width="13" height="220" fill="#ffffff" opacity="0.6" />
    <rect x="142" y="80" width="4" height="220" fill="#ffffff" opacity="0.35" />
    <rect x="186" y="80" width="14" height="220" fill="#2b6a83" opacity="0.24" />
    <!-- reentrância de pegada -->
    <path d="M104 178c8 8 8 26 0 34zM196 178c-8 8-8 26 0 34z" fill="#10231c" opacity="0.07" />

    <!-- rótulo -->
    <rect x="100" y="146" width="100" height="96" fill="url(#det-rotulo)" />
    <rect x="100" y="146" width="100" height="5" fill="#12694a" />
    <rect x="100" y="237" width="100" height="5" fill="#12694a" />

    <!-- brilho: o signo da marca -->
    <g fill="#12694a">
      <path d="M150 158l4.6 10.4L165 173l-10.4 4.6L150 188l-4.6-10.4L135 173l10.4-4.6z" />
      <path d="M170 186l2.4 5.4 5.6 2.4-5.6 2.4-2.4 5.4-2.4-5.4-5.6-2.4 5.6-2.4z" opacity="0.65" />
    </g>

    <text x="150" y="212" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="0" fill="#0a3f29">BRILHO CLARO</text>
    <text x="150" y="226" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="6.8" font-weight="600" letter-spacing="0.2" fill="#2b6a83">DETERGENTE NEUTRO</text>

    <rect x="118" y="250" width="64" height="24" rx="12" fill="#12694a" />
    <text x="150" y="267" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#fbf7ec">500 ml</text>
  </g>

  <!-- bolhas -->
  <g fill="none" stroke="#7ba7bb" stroke-width="2.4">
    <circle cx="62" cy="150" r="15" />
    <circle cx="46" cy="188" r="9" />
    <circle cx="70" cy="212" r="6" />
    <circle cx="242" cy="166" r="12" />
    <circle cx="256" cy="200" r="7" />
  </g>
  <g fill="#ffffff" opacity="0.85">
    <circle cx="57" cy="145" r="4" />
    <circle cx="238" cy="162" r="3.4" />
  </g>
</svg>
