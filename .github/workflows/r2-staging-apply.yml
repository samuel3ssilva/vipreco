name: R2 staging apply

# =============================================================================
# R2.6 - APLICACAO CONTROLADA EM STAGING.
#
# Este e o UNICO workflow deste repositorio que escreve num banco remoto.
#
# Ele nao roda por push, nao roda por pull request, nao roda por agendamento e nao roda
# por chamada de outro workflow. So `workflow_dispatch`, so a partir de `main`, uma
# operacao por disparo, com frase de confirmacao propria por operacao sensivel.
#
# NAO EXISTE OPERACAO QUE APLIQUE TUDO. A ausencia e o desenho: uma operacao assim
# transformaria nove checkpoints em um, e o valor inteiro deste workflow esta nos
# checkpoints -- cada aplicacao e irreversivel contra um ambiente real, e a chance de
# perceber um problema mora no intervalo entre uma e a seguinte.
#
# PRODUCAO E RECUSADA POR CONSTRUCAO, em quatro pontos independentes:
#   1. `SUPABASE_DB_PASSWORD` so existe no Environment `staging`; o Environment
#      `production` nao carrega segredo de banco nenhum;
#   2. `APPLY_ENVIRONMENT` precisa ser exatamente `staging`;
#   3. `preparar_credencial` (R2.3D) aborta se usuario ou host mencionarem o ref de
#      producao, e aborta tambem se os dois refs forem iguais ou faltarem;
#   4. `supabase/config.toml` precisa declarar o project_id de staging.
#
# Nao existe input de ambiente, de host ou de connection string. Tudo que identifica o
# alvo vem de arquivo versionado -- um host vindo de input poderia apontar para outro
# tenant sem ninguem notar.
# =============================================================================

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Operação. Uma por disparo, na ordem do runbook."
        required: true
        type: choice
        options:
          - plan
          - adopt-seven-baseline
          - apply-normalization
          - apply-core-hardening
          - apply-contribution-hardening
          - remediate-demo-gtins
          - apply-r2a
          - apply-r2b
          - validate
      expected_main_sha:
        description: "SHA da main que você leu ao decidir. O job aborta se a main tiver avançado."
        required: true
        type: string
      confirmation_phrase:
        description: "Frase exata da operação (docs/data/R2-CONTROLLED-APPLY-RUNBOOK.md). Vazio para plan/validate."
        required: false
        type: string
        default: ""

# Exclusiva, e sem cancel-in-progress. Duas aplicacoes simultaneas contra o mesmo banco
# produziriam duas sequencias de estado sem forma de saber qual venceu -- e cancelar uma
# no meio deixaria uma transacao aberta contra um ambiente real.
concurrency:
  group: r2-staging-apply
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  aplicar:
    name: "aplicação controlada — ${{ inputs.operation }}"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging

    steps:
      - name: Recusar disparo fora da main
        # Primeira guarda, e antes do checkout de proposito: escrita em ambiente real nao
        # sai de branch, e a recusa nao precisa do repositorio para acontecer.
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Este workflow so roda a partir de 'main' (recebido: ${{ github.ref }})."
          exit 1

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Garantir cliente psql
        run: |
          set -euo pipefail
          if command -v psql >/dev/null 2>&1; then
            psql --version
          else
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends postgresql-client
            psql --version
          fi

      # A CLI oficial e o unico mecanismo de migration usado aqui. Nenhuma linha e inserida
      # a mao na tabela de historico: escrever ali por SQL produziria um historico que a
      # propria CLI nao reconheceria como seu, e a proxima operacao mediria um estado que
      # nao existe.
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.111.0

      - name: Confirmar a versão da CLI
        run: supabase --version

      # A guarda estatica roda de novo dentro de run.sh, antes de abrir conexao. Aqui ela e
      # passo proprio para que, quando reprovar, o log diga qual passo falhou sem ninguem
      # precisar ler o script.
      - name: Guarda estática de read-only
        run: bun scripts/r2/preflight/read-only-guard.ts

      - name: Aplicação controlada
        env:
          # UNICA leitura do segredo em todo o workflow. Ele carrega SO a Database password
          # de staging. O runner o escreve direto num `.pgpass` de modo 0600 e o remove do
          # ambiente em seguida; o que atravessa para `psql` e para a CLI e o CAMINHO do
          # arquivo, nunca o valor, e nunca uma connection string com senha em argv.
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          # Host, porta, usuario e banco NAO vem de segredo: sao derivados de
          # config/environments.json, que ja e versionado e ja e publico.
          APPLY_ENVIRONMENT: staging
          APPLY_OPERATION: ${{ inputs.operation }}
          APPLY_EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
          APPLY_CONFIRMATION_PHRASE: ${{ inputs.confirmation_phrase }}
        run: bash scripts/r2/apply/run.sh
