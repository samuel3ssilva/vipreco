<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 360" width="300" height="360" role="img" aria-hidden="true" focusable="false">
  <!--
    ViPreço — embalagem FICTÍCIA "Flor Macia", desenhada para a demonstração.
    Marca inventada, sem logotipo, sem trade dress de terceiro. Ver docs/data/IMAGE-POLICY.md.

    Fardo plástico de 12 rolos: o que faz o desenho ser reconhecido não é o rótulo, são as
    TOPOS DOS ROLOS aparecendo por trás do filme — os círculos concêntricos em fileira. O
    filme é traduzido por brilhos diagonais e cantos soldados.
  -->
  <defs>
    <linearGradient id="papel-filme" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b9a7c7" />
      <stop offset="0.12" stop-color="#efe6f4" />
      <stop offset="0.4" stop-color="#faf6fc" />
      <stop offset="0.72" stop-color="#e5d9ec" />
      <stop offset="1" stop-color="#a893b8" />
    </linearGradient>
    <linearGradient id="papel-faixa" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7d4f96" />
      <stop offset="1" stop-color="#5c3670" />
    </linearGradient>
    <clipPath id="papel-clip">
      <rect x="52" y="86" width="196" height="188" rx="16" />
    </clipPath>
  </defs>

  <ellipse cx="150" cy="282" rx="98" ry="12" fill="#10231c" opacity="0.16" />

  <!-- cantos soldados do filme -->
  <path d="M52 100l-22-16 30-4zM248 100l22-16-30-4zM52 262l-22 16 30 4zM248 262l22 16-30 4z" fill="#d9cbe2" />

  <!-- fardo -->
  <rect x="52" y="86" width="196" height="188" rx="16" fill="url(#papel-filme)" />
  <g clip-path="url(#papel-clip)">
    <!-- topos dos rolos, em duas fileiras, atrás do filme -->
    <g opacity="0.75">
      <g fill="#ffffff" stroke="#cbbcd6" stroke-width="1.6">
        <circle cx="92" cy="128" r="30" />
        <circle cx="150" cy="128" r="30" />
        <circle cx="208" cy="128" r="30" />
        <circle cx="92" cy="228" r="30" />
        <circle cx="150" cy="228" r="30" />
        <circle cx="208" cy="228" r="30" />
      </g>
      <g fill="none" stroke="#cbbcd6" stroke-width="1.4">
        <circle cx="92" cy="128" r="20" /><circle cx="150" cy="128" r="20" /><circle cx="208" cy="128" r="20" />
        <circle cx="92" cy="228" r="20" /><circle cx="150" cy="228" r="20" /><circle cx="208" cy="228" r="20" />
      </g>
      <g fill="#e9dff0">
        <circle cx="92" cy="128" r="10" /><circle cx="150" cy="128" r="10" /><circle cx="208" cy="128" r="10" />
        <circle cx="92" cy="228" r="10" /><circle cx="150" cy="228" r="10" /><circle cx="208" cy="228" r="10" />
      </g>
    </g>

    <!-- faixa da marca, atravessando o fardo -->
    <rect x="46" y="160" width="208" height="56" fill="url(#papel-faixa)" />
    <rect x="46" y="216" width="208" height="4" fill="#f5c24b" />

    <!-- flor: o signo da marca -->
    <g transform="translate(78 188)" fill="#f3e6f7">
      <g>
        <ellipse cx="0" cy="-11" rx="5.4" ry="9" />
        <ellipse cx="0" cy="11" rx="5.4" ry="9" />
        <ellipse cx="-11" cy="0" rx="9" ry="5.4" />
        <ellipse cx="11" cy="0" rx="9" ry="5.4" />
      </g>
      <circle cx="0" cy="0" r="5" fill="#f5c24b" />
    </g>

    <text x="168" y="184" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="0.4" fill="#ffffff">FLOR MACIA</text>
    <text x="168" y="202" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="600" letter-spacing="0.8" fill="#e0cbea">FOLHA DUPLA · 30 m</text>

    <!-- brilhos diagonais do filme -->
    <g fill="#ffffff" opacity="0.5">
      <path d="M60 86l34 0-64 188H8z" />
      <path d="M120 86l14 0-64 188h-14z" />
    </g>
    <g fill="#7d4f96" opacity="0.1">
      <path d="M236 86l18 0-64 188h-18z" />
    </g>

    <!-- contagem -->
    <rect x="176" y="234" width="66" height="26" rx="13" fill="#ffffff" opacity="0.94" />
    <text x="209" y="252" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#5c3670">12 rolos</text>
  </g>
  <rect x="52" y="86" width="196" height="188" rx="16" fill="none" stroke="#a893b8" stroke-width="1.6" />
</svg>
