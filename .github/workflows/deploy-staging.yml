name: Deploy (staging)

on:
  workflow_dispatch: {}

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: build, verify-env, deploy
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      # `VITE_WHATSAPP_NUMBER` é *secret* do Environment, não *variable*. O valor em si é público
      # por construção — vai no bundle do cliente e no link que qualquer visitante enxerga —, mas
      # só como secret o GitHub o mascara sozinho em todo o log, inclusive nos blocos `env:`.
      # Com isso o workflow não precisa de nenhuma etapa de `add-mask`.
      - name: Write .env for staging
        run: |
          cat <<EOF > .env
          SUPABASE_PROJECT_ID=${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_PUBLISHABLE_KEY=${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_PROJECT_ID=${{ secrets.SUPABASE_PROJECT_ID }}
          VITE_SUPABASE_PUBLISHABLE_KEY=${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          VITE_PUBLIC_SITE_URL=https://samuel3ssilva-vipreco.samuel-bortoletto.workers.dev
          VITE_WHATSAPP_NUMBER=${{ secrets.VITE_WHATSAPP_NUMBER }}
          EOF

      - name: Verify environment (falha segura se o ambiente estiver trocado)
        run: bun run verify-env:staging

      - name: Build
        run: bun run build

      - name: Deploy to Cloudflare Workers (staging)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bunx wrangler@4.115.0 deploy --name samuel3ssilva-vipreco

      - name: Smoke test (falha o job se o Worker de staging não responder)
        run: |
          URL="https://samuel3ssilva-vipreco.samuel-bortoletto.workers.dev"
          for path in "/" "/buscar"; do
            ok=""
            for attempt in 1 2 3 4 5; do
              code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$URL$path" || echo "000")
              if [ "$code" = "200" ]; then ok=1; break; fi
              echo "Tentativa $attempt em $path: HTTP $code — tentando de novo em 5s"
              sleep 5
            done
            if [ -z "$ok" ]; then
              echo "::error::Smoke test falhou em $path após 5 tentativas (último HTTP $code)."
              exit 1
            fi
            echo "OK: $path respondeu 200"
          done
