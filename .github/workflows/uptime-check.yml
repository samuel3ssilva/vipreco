name: Uptime check

# Onda 4 - checagem periodica de disponibilidade e headers de seguranca dos dois
# Workers publicos (staging e producao). So faz GET nos hosts *.workers.dev ja
# publicos (mesmos do smoke test de deploy) -- nenhum secret, nenhuma escrita, nenhum
# acesso a Supabase. Em falha, abre ou atualiza uma unica issue rotulada "incidente"
# (nao cria uma nova a cada execucao) usando o GITHUB_TOKEN padrao do repositorio.
# Ver docs/operations/ONDA-4-TECHNICAL-PLAN.md e docs/operations/RESILIENCE-RUNBOOK.md.

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

concurrency:
  group: uptime-check
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  check:
    name: checar staging e produção
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Checar disponibilidade e headers de segurança
        id: check
        run: bun scripts/check-uptime.ts

      - name: Abrir/atualizar issue de incidente (só roda se a checagem acima falhar)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          BODY="Uptime check falhou em $(date -u +"%Y-%m-%dT%H:%M:%SZ"). Detalhes: $RUN_URL"
          gh label create incidente --repo "${{ github.repository }}" --color "d93f0b" \
            --description "Falha detectada pelo uptime-check.yml" --force
          EXISTING=$(gh issue list --repo "${{ github.repository }}" --label incidente --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "${{ github.repository }}" --body "$BODY"
          else
            gh issue create --repo "${{ github.repository }}" \
              --title "Uptime check falhou — investigar staging/produção" \
              --label incidente \
              --body "$BODY"
          fi

      - name: Fechar issue de incidente (só roda se a checagem acima passou e havia issue aberta)
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          EXISTING=$(gh issue list --repo "${{ github.repository }}" --label incidente --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "${{ github.repository }}" \
              --body "Uptime check voltou a passar em $(date -u +"%Y-%m-%dT%H:%M:%SZ")."
            gh issue close "$EXISTING" --repo "${{ github.repository }}"
          fi
