<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 360" width="300" height="360" role="img" aria-hidden="true" focusable="false">
  <!--
    ViPreço — embalagem FICTÍCIA "Vale Dourado", desenhada para a demonstração.
    Marca inventada, sem logotipo, sem trade dress de terceiro. Ver docs/data/IMAGE-POLICY.md.

    Garrafa PET de 900 ml: ombro alto, gargalo curto, tampa de rosca e o líquido âmbar
    visível acima e abaixo do rótulo. É o líquido translúcido que nomeia a categoria.
  -->
  <defs>
    <linearGradient id="oleo-liquido" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c98a12" />
      <stop offset="0.16" stop-color="#f2c14e" />
      <stop offset="0.38" stop-color="#ffd977" />
      <stop offset="0.66" stop-color="#efb838" />
      <stop offset="1" stop-color="#a86f0c" />
    </linearGradient>
    <linearGradient id="oleo-rotulo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#dfd7c4" />
      <stop offset="0.14" stop-color="#fbf7ec" />
      <stop offset="0.6" stop-color="#ffffff" />
      <stop offset="1" stop-color="#d8d0bd" />
    </linearGradient>
    <clipPath id="oleo-clip">
      <path d="M112 96c0-10 4-14 4-24V70h68v2c0 10 4 14 4 24l10 34c4 14 6 22 6 34v96c0 16-10 26-26 26h-56c-16 0-26-10-26-26v-96c0-12 2-20 6-34z" />
    </clipPath>
  </defs>

  <ellipse cx="150" cy="290" rx="66" ry="11" fill="#10231c" opacity="0.16" />

  <!-- tampa -->
  <rect x="126" y="34" width="48" height="26" rx="5" fill="#0e5c3c" />
  <rect x="126" y="34" width="48" height="26" rx="5" fill="url(#oleo-liquido)" opacity="0.06" />
  <g stroke="#0a3f29" stroke-opacity="0.5" stroke-width="1.6">
    <path d="M132 38v18M141 37v20M150 37v20M159 37v20M168 38v18" />
  </g>
  <rect x="128" y="36" width="7" height="22" rx="3" fill="#ffffff" opacity="0.22" />
  <rect x="124" y="58" width="52" height="8" rx="3" fill="#0a3f29" />
  <!-- gargalo -->
  <rect x="130" y="64" width="40" height="12" fill="#e8dcbc" opacity="0.7" />

  <!-- corpo -->
  <path d="M112 96c0-10 4-14 4-24V70h68v2c0 10 4 14 4 24l10 34c4 14 6 22 6 34v96c0 16-10 26-26 26h-56c-16 0-26-10-26-26v-96c0-12 2-20 6-34z" fill="url(#oleo-liquido)" />
  <g clip-path="url(#oleo-clip)">
    <!-- gomos do PET -->
    <g fill="#10231c" opacity="0.08">
      <rect x="90" y="222" width="120" height="7" />
      <rect x="90" y="238" width="120" height="7" />
      <rect x="90" y="254" width="120" height="7" />
    </g>
    <!-- brilho especular e sombra da borda -->
    <rect x="120" y="60" width="15" height="230" fill="#ffffff" opacity="0.5" />
    <rect x="140" y="60" width="5" height="230" fill="#ffffff" opacity="0.28" />
    <rect x="186" y="60" width="16" height="230" fill="#7a4c04" opacity="0.3" />

    <!-- rótulo -->
    <rect x="86" y="132" width="128" height="82" fill="url(#oleo-rotulo)" />
    <rect x="86" y="132" width="128" height="5" fill="#0e5c3c" />
    <rect x="86" y="209" width="128" height="5" fill="#0e5c3c" />

    <!-- gota, o signo da categoria -->
    <path d="M150 148c7 9 11 14 11 20a11 11 0 0 1-22 0c0-6 4-11 11-20z" fill="#efb838" />
    <path d="M147 165a5 5 0 0 0 4 5" fill="none" stroke="#fbf7ec" stroke-width="1.6" stroke-linecap="round" />

    <text x="150" y="190" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="0.2" fill="#0a3f29">VALE DOURADO</text>
    <text x="150" y="204" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="7.5" font-weight="600" letter-spacing="0.8" fill="#8a6412">ÓLEO DE SOJA TIPO 1</text>

    <rect x="118" y="222" width="64" height="24" rx="12" fill="#fbf7ec" opacity="0.94" />
    <text x="150" y="239" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0a3f29">900 ml</text>
  </g>
</svg>
